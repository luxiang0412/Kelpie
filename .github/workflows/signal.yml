# Herdr Signal（signal/）的 CI：单元测试 + lint + 三种构建。
# 只在 signal/ 有改动时跑；旧客户端 android/ 不受影响。
# 发布签名：仓库 secret 里放 SIGNAL_KEYSTORE_BASE64 / SIGNAL_KEYSTORE_PASSWORD 时才签正式包，否则 release 用 debug 签名（与本地一致）。
name: signal

on:
  push:
    branches: [main]
    paths: ["signal/**", ".github/workflows/signal.yml"]
  pull_request:
    paths: ["signal/**", ".github/workflows/signal.yml"]
  workflow_dispatch:

concurrency:
  group: signal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Release keystore (optional)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KS: ${{ secrets.SIGNAL_KEYSTORE_BASE64 }}
          PW: ${{ secrets.SIGNAL_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > signal-release.jks
            printf 'storeFile=signal-release.jks\nstorePassword=%s\nkeyAlias=signal\nkeyPassword=%s\n' "$PW" "$PW" > keystore.properties
          fi

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Screenshot tests (Roborazzi)
        # 基准图在 app/src/test/screenshots/；UI 有意改动时本地跑 recordRoborazziDebug 后一起提交
        run: ./gradlew :app:verifyRoborazziDebug --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: i18n literal check
        # 新加的中文字面量必须包在 t("中文", "English") 里
        run: python3 tools/i18n_literals.py --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-reports
          path: |
            signal/**/build/reports/
            signal/**/build/test-results/
            signal/app/build/outputs/roborazzi/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: signal-apks
          path: signal/app/build/outputs/apk/**/*.apk
          retention-days: 14
