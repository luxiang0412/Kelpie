# Kelpie 的 CI：单元测试、截图回归、lint、debug + release 构建、文案检查。
# 只改文档（docs/、*.md）时不跑。
# 发布签名：仓库 secret 里放 KELPIE_KEYSTORE_BASE64 / KELPIE_KEYSTORE_PASSWORD 时才签正式包，否则显式加 -Pkelpie.allowDebugSigning=true 用 debug 签名（本地默认不允许）。
name: android

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Release keystore (optional)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KS: ${{ secrets.KELPIE_KEYSTORE_BASE64 }}
          PW: ${{ secrets.KELPIE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > kelpie-release.jks
            printf 'storeFile=kelpie-release.jks\nstorePassword=%s\nkeyAlias=signal\nkeyPassword=%s\n' "$PW" "$PW" > keystore.properties
          fi

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Screenshot tests (Roborazzi)
        # 基准图在 app/src/test/screenshots/；UI 有意改动时本地跑 recordRoborazziDebug 后一起提交
        run: ./gradlew :app:verifyRoborazziDebug --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain $( [ -f keystore.properties ] || echo -Pkelpie.allowDebugSigning=true )

      - name: i18n literal check
        # 新加的中文字面量必须包在 t("中文", "English") 里
        run: python3 tools/i18n_literals.py --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kelpie-reports
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/roborazzi/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: kelpie-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
