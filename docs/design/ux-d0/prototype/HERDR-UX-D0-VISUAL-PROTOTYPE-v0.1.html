<div class="workspace">
<section class="controls">
 <div class="eyebrow">HERDR · UX-D0</div><h1>Visual Review <span style="font-size:12px;color:#9cb0ff">v0.1</span></h1>
 <p>Graphite × Editorial · 三屏设计样机<br/>原型使用虚构的 Fixture，不连接任何真实主机。</p>

 <div class="explain"><strong>本轮只做视觉验收。</strong><br/>主机选择器放在标题下方、Composer 采用轻量双层 Surface，均为<strong>推荐候选</strong>，尚未被用户正式批准。复制 + 更多与自适应语音入口的原则已冻结。<br/><br/>注意：HTML 仅用于设计判断，不代表 Android Compose 行为或真机无障碍验收。</div>
</section>
<section class="preview-area"><div class="preview-title" id="previewTitle"></div><div class="phone-shell"><div class="phone" id="phone"></div></div><div class="note" id="note"></div></section>
</div>
<script>

const t={zh:{board:'工作台',all:'全部主机',connected:'2 台主机已连接',attention:'需要处理',working:'运行中',done:'已完成 · 1',idle:'空闲 · 2',activity:'活动',hosts:'主机',project:'项目',taskA:'优化数据库查询性能',wait:'等待下一步指令',summary:'Pi 已完成分析，正在等待下一步指令。',metaA:'Pi · backend · Dev-01',taskB:'Android UI 重构',metaB:'Pi · herdr-android · Dev-01',taskC:'文档解析优化',metaC:'Pi · parser · Dev-02',off:'连接中断 · 显示缓存',stale:'数据过期，当前操作不可确认',convTitle:'Android 客户端重构',run:'运行中',user:'检查对话列表的性能，先运行测试，再给我结论。',agentIntro:'我检查了渲染和状态更新路径，发现以下两个重点。',analysis:'检查结果',finding1:'新消息追加时，应避免重新处理全部历史消息。',finding2:'大型工具输出需要按需加载。',tool:'运行测试',toolState:'工具结果已收到',toolOutput:'查看完整输出',agentEnd:'建议先建立固定数据集，然后比较增量与全量路径。',copy:'复制',more:'更多',draftHint:'给 Pi 发送下一步指令…',typeDraft:'继续修复对话页面，优先保证阅读位置稳定。',unknown:'发送结果无法确认',unknownDesc:'远端可能已经收到该指令。请检查记录，不会自动重发。',viewRecord:'查看记录',editor:'长 Prompt 编辑',editDescription:'在这里可以粘贴较长的代码或错误堆栈，确认无误后再发送。',saveDraft:'草稿已保存',send:'发送',back:'返回',privacy:'语音仅作为转文字草稿，绝不自动发送。'},en:{board:'Workspace',all:'All hosts',connected:'2 hosts connected',attention:'Needs attention',working:'Running',done:'Completed · 1',idle:'Idle · 2',activity:'Activity',hosts:'Hosts',project:'Project',taskA:'Optimize database query performance',wait:'Waiting for next instruction',summary:'Pi finished its analysis and is awaiting your next instruction.',metaA:'Pi · backend · Dev-01',taskB:'Refactor Android UI',metaB:'Pi · herdr-android · Dev-01',taskC:'Improve document parser',metaC:'Pi · parser · Dev-02',off:'Disconnected · showing cached data',stale:'Data is stale; actions cannot be confirmed',convTitle:'Android client refactor',run:'Running',user:'Check conversation list performance, run tests first, then summarize.',agentIntro:'I inspected the rendering and state update paths. Two findings stand out.',analysis:'Findings',finding1:'Avoid remapping the entire history when new messages arrive.',finding2:'Large tool outputs should load on demand.',tool:'Run tests',toolState:'Tool result received',toolOutput:'View full output',agentEnd:'I recommend creating a fixed dataset before comparing incremental and full mapping.',copy:'Copy',more:'More',draftHint:'Message Pi with the next instruction…',typeDraft:'Continue improving conversation layout and preserve scroll position.',unknown:'Delivery status unknown',unknownDesc:'The remote may have received this. Review the record; this will not auto-retry.',viewRecord:'Review record',editor:'Long prompt editor',editDescription:'Paste long code or stack traces here. Review before sending.',saveDraft:'Draft saved',send:'Send',back:'Back',privacy:'Voice input is editable text only; it will never auto-send.'}};
function nav(T){return `<div class="nav"><div class="nav-item active">${icon('dashboard')}<small>${T.board}</small></div><div class="nav-item">${icon('inbox')}<small>${T.activity}</small></div><div class="nav-item">${icon('server')}<small>${T.hosts}</small></div></div>`}
function board(T){const offline=S.scenario==='offline';const empty=S.scenario==='empty';return `<div class="app-head"><div class="brand">HERDR</div><div class="heading"><h1>${T.board}</h1><div class="head-actions"><span class="iconbtn">${icon('search')}</span><span class="iconbtn">${icon('settings')}</span></div></div><div class="hostline"><div class="host-select"><span>${T.all}</span>${icon('chevronDown')}</div><span class="conn"><span class="dot" style="background:${offline?'var(--attn)':'var(--success)'}"></span>${offline?T.off:T.connected}</span></div></div><div class="thin"></div><div class="scroll board-scroll">${offline?`<div class="unknown-banner"><strong>${T.off}</strong>${T.stale}</div>`:''}${empty?`<div style="padding:90px 0;text-align:center;color:var(--muted);font-size:14px">${S.lang==='zh'?'主机在线，当前未发现 Agent':'Connected, but no active agents found'}</div>`:`<div class="section-header"><strong>${T.attention}</strong><span class="count">2</span></div><div class="attention-card important"><div class="kicker"><span>${T.wait}</span><em>Pi</em></div><div class="task-title">${T.taskA}</div><div class="task-desc">${T.summary}</div><div class="sub">${T.metaA}</div></div><div class="attention-card"><div class="kicker"><span>${T.attention}</span><em>Claude Code</em></div><div class="task-title">${S.lang==='zh'?'修复构建失败':'Fix build failures'}</div><div class="sub">${S.lang==='zh'?'mobile-app · Dev-02':'mobile-app · Dev-02'}</div></div><div class="section-header" style="margin-top:26px"><strong>${T.working}</strong><span class="count">2</span></div><div class="agent-row"><div class="statusmark">${icon('activity')}</div><div class="agent-main"><div class="task-title">${T.taskB}</div><div class="sub">${T.metaB}</div></div><span class="right">${icon('chevronRight')}</span></div><div class="agent-row"><div class="statusmark">${icon('activity')}</div><div class="agent-main"><div class="task-title">${T.taskC}</div><div class="sub">${T.metaC}</div></div><span class="right">${icon('chevronRight')}</span></div><div class="collapse-row"><span>${T.done}</span>${icon('chevronDown')}</div><div class="collapse-row" style="margin-top:0;border-top:0"><span>${T.idle}</span>${icon('chevronDown')}</div>`}</div>${nav(T)}`}
function footerComposer(T,prefill=false){const compact=S.width<360 || S.scale>=1.3;return `<div class="composer-zone"><div class="composer"><div class="draft-text ${prefill?'':'placeholder'}">${prefill?T.typeDraft:T.draftHint}</div><div class="actionrow"><div class="tools"><span class="toolbtn">${icon('plus')}</span>${!compact?`<span class="toolbtn">${icon('mic')}</span>`:`<span class="toolbtn">${icon('ellipsis')}</span>`}<span class="toolbtn">${icon('expand')}</span></div><span class="wordcount">${prefill?(S.lang==='zh'?'26 字':'63 chars'):''}</span><span class="sendbtn">${icon('arrowUp')}</span></div></div></div>`}
function chat(T){return `<div class="conversation-head"><span class="iconbtn">${icon('arrowLeft')}</span><div class="headmeta"><strong>${T.convTitle}</strong><span>Pi · Dev-01 · <span style="display:inline;color:var(--working)">${T.run}</span></span></div><span class="iconbtn">${icon('search')}</span><span class="iconbtn">${icon('ellipsis')}</span></div><div class="thin"></div><div class="scroll chat-scroll"><div class="bubble-wrap"><div class="bubble">${T.user}</div></div><div class="assistant-label"><span class="agent-logo">${icon('code')}</span>Pi</div><div class="chat-body"><p>${T.agentIntro}</p><h2>${T.analysis}</h2><ol><li>${T.finding1}</li><li>${T.finding2}</li></ol><div class="toolcard"><div class="toolhead"><span class="toolicon">${icon('terminal')}</span><div class="toolname"><strong>${T.tool}</strong><span>${T.toolState}</span></div><span style="color:var(--muted)">${icon('chevronDown')}</span></div><div class="codepreview">./gradlew testDebugUnitTest</div><div class="toolfooter"><span>${T.toolOutput}</span><span style="color:var(--muted)">${icon('copy')}</span></div></div><p>${T.agentEnd}</p></div><div class="msg-actions"><span class="lightaction">${icon('copy')}${T.copy}</span><span class="lightaction">${icon('ellipsis')}${T.more}</span><span class="message-time">12:08</span></div></div>${S.scenario==='unknown'?`<div class="unknown-banner"><strong>${T.unknown}</strong>${T.unknownDesc}<div style="margin-top:5px;color:var(--accent);font-weight:650">${T.viewRecord}</div></div>`:''}${footerComposer(T)}`}
function focus(T){return `<div class="conversation-head"><span class="iconbtn">${icon('arrowLeft')}</span><div class="headmeta"><strong>${T.editor}</strong><span>Pi · Dev-01 · ${T.saveDraft}</span></div><span class="iconbtn">${icon('ellipsis')}</span></div><div class="thin"></div><div class="scroll composer-focus"><div class="focus-label">${T.editDescription}</div><div class="prompt-editor"><p>${T.typeDraft}</p><p>${S.lang==='zh'?'重点：':'Focus:'}</p><p>1. LazyColumn stable keys</p><p>2. Preserve scroll anchor</p><p>3. Unknown is not Failed <span class="caret"></span></p></div><div style="display:flex;justify-content:space-between;margin-top:15px;font-size:12px;color:var(--muted)"><span>129 ${S.lang==='zh'?'字符':'characters'}</span><span>${T.saveDraft}</span></div><div style="margin:20px 0;color:var(--muted);font-size:12px">${T.privacy}</div></div><div class="composer-zone"><div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:12px;color:var(--muted)">${T.saveDraft}</span><span style="background:var(--accent);color:var(--onAccent);border-radius:24px;padding:11px 18px;font-size:13px;font-weight:650">${T.send}</span></div></div><div class="pseudo-keyboard">${['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].map((r)=>`<div class="kbrow">${r.split('').map(c=>`<span class="key">${c}</span>`).join('')}</div>`).join('')}<div class="kbrow"><span class="key" style="flex:1.5">?123</span><span class="key" style="flex:4">space</span><span class="key" style="flex:1.5">↵</span></div></div>`}
function makeOptions(id,items,prop){let host=document.getElementById(id);host.innerHTML=items.map(x=>`<button data-prop="${prop}" data-val="${x[0]}" class="${String(S[prop])===String(x[0])?'on':''}">${x[1]}</button>`).join('');host.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{S[prop]=['width','scale'].includes(prop)?Number(btn.dataset.val):btn.dataset.val;render()})}
function render(){const T=t[S.lang];makeOptions('screenOptions',[['board',S.lang==='zh'?'工作台':'Board'],['chat',S.lang==='zh'?'对话':'Chat'],['focus',S.lang==='zh'?'Composer':'Composer']],'screen');makeOptions('themeOptions',[['dark','Dark'],['light','Light']],'theme');makeOptions('langOptions',[['zh','中文'],['en','English']],'lang');makeOptions('widthOptions',[[320,'320dp'],[393,'393dp'],[600,'600dp']],'width');makeOptions('scaleOptions',[[1,'1×'],[1.3,'1.3×'],[1.6,'1.6×']],'scale');const scen=S.screen==='board'?[['normal',S.lang==='zh'?'正常':'Normal'],['offline',S.lang==='zh'?'离线':'Offline'],['empty',S.lang==='zh'?'空状态':'Empty']]:S.screen==='chat'?[['normal',S.lang==='zh'?'正常':'Normal'],['unknown',S.lang==='zh'?'发送未知':'Unknown']]:[['normal',S.lang==='zh'?'长文本':'Long text']];if(!scen.some(x=>x[0]===S.scenario))S.scenario='normal';makeOptions('scenarioOptions',scen,'scenario');const phone=document.getElementById('phone');phone.className='phone '+(S.theme==='light'?'light':'')+((S.width<360&&S.scale>=1.3)?' compact-large':'');phone.style.width=S.width+'px';phone.style.setProperty('--scale',S.scale);phone.style.setProperty('--gutter',S.width<360?'16px':'20px');phone.innerHTML=`<div class="statusbar"><span>9:41</span><span class="symbols">▂ ▄ ▆ &nbsp; ◆ &nbsp; 90%</span></div><div class="screen">${S.screen==='board'?board(T):S.screen==='chat'?chat(T):focus(T)}</div><div class="osbottom"><span></span></div>`;document.getElementById('previewTitle').textContent=`${{board:'Board',chat:'Conversation',focus:'Composer'}[S.screen]} · ${S.width}dp · ${S.scale}× · ${S.theme} · ${S.lang.toUpperCase()}`;document.getElementById('note').innerHTML=`<strong>${S.lang==='zh'?'视觉原型（非产品截图）':'Visual concept, not a product screenshot'}</strong> · 不是实际 Compose / Android 运行结果。内置的主机、Agent、运行结果均为虚构数据。`}
render();
</script>
</body></html>
